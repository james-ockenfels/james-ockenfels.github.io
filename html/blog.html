<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="../img/FAVICON.png">
    <link rel="stylesheet" href="../css/blog.css">
</head>
<body>

    <header>
        <div class="left-header">
            <h1>James Ockenfels</h1>
        </div>
        <div class="menu-toggle" id="menu-toggle">☰</div>
        <nav class="right-header">
            <a href="../index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="goals.html">Goals</a>
            <a href="education.html">Education</a>
            <a href="about.html">About Me</a>
            <a href="contact.html">Contact</a>
            <a href="downloads.html">Downloads</a>
            <a href="blog.html" class="active">Blog</a>
        </nav>
    </header>

    <script>
        const toggle = document.getElementById("menu-toggle");
        const nav = document.querySelector(".right-header");
        toggle.addEventListener("click", () => nav.classList.toggle("active"));
    </script>

    <main>
        <div class="blog-hero">
            <h2>The Blog</h2>
            <p>Random projects, write-ups, and things I figured out along the way.</p>
        </div>

        <div class="blog-controls">
            <input type="text" id="search-input" placeholder="Search posts…" />
            <select id="sort-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>

        <div class="blog-list" id="blog-list"></div>
        <p class="no-results" id="no-results" style="display:none;">No posts found.</p>
    </main>

    <footer>
        <p>Connect with me:</p>
        <a href="https://github.com/james-ockenfels" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/james-ockenfels-770811391/" target="_blank">LinkedIn</a>
        <a href="https://tryhackme.com/p/hackerman102030" target="_blank">TryHackMe</a>
    </footer>

    <script>
        // ============================================================
        // BLOG POSTS CONFIG — add new posts here!
        // Fields:
        //   title       — post title
        //   date        — "YYYY-MM-DD" format (used for sorting)
        //   description — short summary shown on the hub
        //   image       — path to thumbnail image (relative to this file)
        //   url         — path to the blog post HTML file
        // ============================================================
        const posts = [
            {
                title: "Setting Up My Website",
                date: "2024-11-10",
                description: "How i built a website from scratch, the very same you are on now",
                image: "../img/blog/website.png",
                url: "blog/website.html"
            },
            {
                title: "Making a universal IR remote",
                date: "2025-3-17",
                description: "I built a Flipper Zero-inspired IR remote tool using an ESP32, an OLED screen, and a handful of components",
                image: "../img/blog/Flipper-32.jpg",
                url: "blog/flipper-32.html"
            },
            {
                title: "Making a Website Scraper",
                date: "2025-4-14",
                description: "How I built a stealthy scraper to get past the security on Amazon, DoorDash, and Ticketmaster",
                image: "../img/blog/Website-scraper.png",
                url: "blog/Website-scraper.html"
            },
            {
                title: "Building a Secure User Manager in Python",
                date: "2025-5-12",
                description: "A CLI app I built for my Scripting Fundamentals final that handles user registration, bcrypt password hashing, CSV import/export, and checks for credential leaks.",
                image: "../img/blog/Secure-messenger.png",
                url: "blog/Secure-messenger.html"
            } ,
            {
                title: "DIY IR Blaster: From Weak Remote to Signal Cannon",
                date: "2024-12-20",
                description: "My LED remote couldn't reach from my bed, so I built an amplified IR blaster over Christmas break, then added a headphone jack input so my phone can send custom IR codes through an audio app.",
                image: "../img/blog/IR-Blaster.jpg",
                url: "blog/IR-Blaster.html"
            },
            {
                title: "I Earned The Google IT Support Certificate",
                date: "2025-1-10",
                description: "It's a five-course program on Coursera covering the fundamentals of IT support: hardware, operating systems, networking, system administration, and security basics",
                image: "../img/blog/GoogleIT.png",
                url: "blog/GoogleIT.html"
            },
            {
                title: "I Earned The Google CyberSecurity Certificate",
                date: "2026-2-27",
                description: "an eight-course program that picks up where the IT Support certificate left off and goes deep into cybersecurity specifically",
                image: "../img/blog/GoogleCyberSecuirty.png",
                url: "blog/GoogleCyberSecurity.html"
            }
        ];
        // ============================================================
        // END CONFIG — no need to edit below this line
        // ============================================================

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split("-");
            return new Date(y, m - 1, d).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
        }

        function renderPosts(list) {
            const container = document.getElementById("blog-list");
            const noResults = document.getElementById("no-results");
            container.innerHTML = "";

            if (list.length === 0) {
                noResults.style.display = "block";
                return;
            }
            noResults.style.display = "none";

            list.forEach((post, i) => {
                const card = document.createElement("article");
                card.className = "blog-card";
                card.style.animationDelay = `${i * 0.07}s`;
                card.innerHTML = `
                    <a href="${post.url}" class="card-image-link">
                        <div class="card-image" style="background-image: url('${post.image}')"></div>
                    </a>
                    <div class="card-content">
                        <span class="card-date">${formatDate(post.date)}</span>
                        <h3 class="card-title"><a href="${post.url}">${post.title}</a></h3>
                        <p class="card-desc">${post.description}</p>
                        <a href="${post.url}" class="card-link">Read post →</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getFiltered() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const sort = document.getElementById("sort-select").value;

            let filtered = posts.filter(p =>
                p.title.toLowerCase().includes(query) ||
                p.description.toLowerCase().includes(query)
            );

            filtered.sort((a, b) => {
                if (sort === "newest") return new Date(b.date) - new Date(a.date);
                if (sort === "oldest") return new Date(a.date) - new Date(b.date);
                if (sort === "az") return a.title.localeCompare(b.title);
                if (sort === "za") return b.title.localeCompare(a.title);
            });

            return filtered;
        }

        document.getElementById("search-input").addEventListener("input", () => renderPosts(getFiltered()));
        document.getElementById("sort-select").addEventListener("change", () => renderPosts(getFiltered()));

        renderPosts(getFiltered());
    </script>
</body>
</html>
